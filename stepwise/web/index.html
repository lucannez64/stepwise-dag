<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stepwise plan</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div class="toolbar"><h1 id="title">Plan</h1><div id="summary" aria-label="Progress summary"></div><input id="search" aria-label="Find a node" type="search" placeholder="Find a node"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="fit">Fit all</button><button id="readable">Readable</button><button id="progress-only">In progress</button><button id="direct" aria-pressed="true">Direct edges</button><button id="list-view" aria-pressed="false">Order</button><button id="settings-toggle">Customize</button><span id="connection" role="status"></span></div><div class="legend"><span class="tag done">● completed</span><span class="tag unpushed">◌ completed, not pushed</span><span class="tag in_progress">◐ in progress</span><span class="tag ready">○ ready to start</span><span class="tag waiting">○ waiting</span><span class="tag blocked">● blocked</span><span id="repo"></span></div></header>
<section id="settings" hidden aria-label="Interface preferences"><label>Theme <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Density <select id="density"><option value="compact">Compact</option><option value="comfortable">Comfortable</option></select></label><label>Direction <select id="direction"><option value="vertical">Top to bottom</option><option value="horizontal">Left to right</option></select></label><label>Text <input id="font" type="range" min="11" max="16" value="13"></label><label>Panel <input id="panel" type="range" min="260" max="520" value="360"></label><label><input type="checkbox" id="show-size" checked> Estimates</label><label>Show <select id="filter"><option value="all">All steps</option><option value="ready">Ready</option><option value="in_progress">In progress</option><option value="blocked">Blocked</option><option value="done">Done</option><option value="inconsistent">Prerequisite conflicts</option></select></label><label>Area <select id="area"><option value="">All areas</option></select></label><button id="chain">Longest chain</button><button id="reset-prefs">Reset preferences</button></section>
<main><section id="viewport" aria-label="Dependency graph"><div id="world"><svg id="edges" aria-hidden="true"></svg><div id="nodes"></div></div></section><aside><section id="detail"></section><section id="activity-panel"><h2 id="activity-title">Running log</h2><div id="activity"></div><div id="order" hidden></div></section></aside></main><div id="error" role="alert" hidden></div></body></html>
