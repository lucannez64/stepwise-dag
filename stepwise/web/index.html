<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Stepwise</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  /* Apply the saved theme before first paint. */
  (function () {
    var t = "system";
    try { t = JSON.parse(localStorage.getItem("stepwise.hub.v1") || "{}").theme || "system"; } catch (e) {}
    if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "macchiato" : "latte";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <a class="brand" href="#/" title="All projects (0)" aria-label="All projects">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6.5v4.5a3 3 0 0 0 3 3h6M6 11v6.5M18 14v3.5" opacity=".55"/><rect x="3" y="3" width="6" height="4" rx="1.2" fill="var(--green)" stroke="none"/><rect x="3" y="17" width="6" height="4" rx="1.2" fill="var(--blue)" stroke="none"/><rect x="15" y="12" width="6" height="4" rx="1.2" fill="var(--yellow)" stroke="none"/><rect x="15" y="18.5" width="6" height="3" rx="1" fill="var(--o0)" stroke="none"/></g></svg>
      <span>Stepwise</span>
    </a>
    <div class="switcher" id="switcher">
      <button class="switch-btn" id="switchBtn" aria-haspopup="menu" aria-expanded="false">
        <i class="dotp" id="switchDot"></i><span class="name" id="switchName">All projects</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="prefsBtn" aria-label="View settings" aria-expanded="false" title="View settings">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></g></svg>
    </button>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="toolbar" id="toolbar" hidden>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Find a step" aria-label="Find a step by id, title or check" autocomplete="off" spellcheck="false">
      <span class="kbd" id="qKbd">/</span><span class="count" id="qCount" hidden></span><button class="qclear" id="qClear" type="button" aria-label="Clear search" hidden>✕</button>
    </label>
    <div class="seg" role="group" aria-label="View">
      <button data-view="graph" aria-pressed="true" title="Graph (g)"><svg class="vi" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="2" width="5" height="4" rx="1"/><rect x="9.5" y="10" width="5" height="4" rx="1"/><path d="M4 6v2.5a2 2 0 0 0 2 2h3.5"/></g></svg><span class="vl">Graph</span></button>
      <button data-view="order" aria-pressed="false" title="Build order (o)"><svg class="vi" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 4h8M6 8h8M6 12h8"/><circle cx="2.5" cy="4" r=".9"/><circle cx="2.5" cy="8" r=".9"/><circle cx="2.5" cy="12" r=".9"/></g></svg><span class="vl">Order</span></button>
      <button data-view="table" aria-pressed="false" title="Table (t)"><svg class="vi" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M1.5 6.5h13M6 6.5v7"/></g></svg><span class="vl">Table</span></button>
    </div>
    <span class="vsep"></span>
    <div class="seg" role="group" aria-label="Show" id="filterSeg">
      <button data-filter="" aria-pressed="true">All</button>
      <button data-filter="progress" aria-pressed="false" title="Only steps in progress"><i class="sw" style="background:var(--progress)"></i>In progress <span class="n" id="nProg"></span></button>
      <button data-filter="ready" aria-pressed="false" title="Only steps whose prerequisites are done"><i class="sw" style="background:var(--ready)"></i>Ready <span class="n" id="nReady"></span></button>
      <button data-filter="blocked" aria-pressed="false" id="fBlocked" hidden><i class="sw" style="background:var(--blocked)"></i>Blocked <span class="n" id="nBlocked"></span></button>
    </div>
    <button class="tog only-phone" id="moreBtn" aria-expanded="false" aria-controls="tbMore">More</button>
    <div class="tb-more" id="tbMore">
    <button class="tog" id="critBtn" aria-pressed="false" title="Longest dependency chain (c)"><i class="sw" style="background:var(--crit)"></i><span>Critical path</span></button>
    <button class="tog" id="ctxBtn" aria-pressed="false" hidden title="Keep every step in its usual place and fade the ones the filters leave out">Keep layout</button>
    <button class="tog" id="edgeBtn" aria-pressed="false" title="When a step is selected, highlight only its direct links (e)">Direct edges</button>
    <div class="areapick" id="areaPick">
      <button class="tog" id="areaBtn" aria-haspopup="true" aria-expanded="false"><span id="areaLbl">Areas</span>
        <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <div class="menu areamenu" id="areaMenu" hidden></div>
    </div>
    </div>
    <span class="spacer"></span>
    <div class="zoom" id="actNav" hidden title="Step through the work in progress">
      <button id="actPrev" aria-label="Previous step in progress">‹</button><span class="pct" id="actPos">1 / 1</span><button id="actNext" aria-label="Next step in progress">›</button>
    </div>
    <div class="zoom" id="zoomCtl">
      <button id="zOut" aria-label="Zoom out" title="Zoom out (−)">−</button>
      <span class="pct" id="zPct">100%</span>
      <button id="zIn" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button class="fit" id="zFocus" title="Focus the work in progress (w)">Focus active</button>
      <button class="fit" id="zFit" title="See the whole plan (f)">Overview</button>
    </div>
    <button class="iconbtn" id="dirBtn" title="Graph direction (d)" aria-label="Switch graph direction"></button>
  </div>
  <main id="main"></main>
  <footer class="statusbar" id="statusbar">
    <span class="live" id="live"><i></i><span id="liveT">connecting</span></span>
    <div class="legend" id="legend"></div>
    <div class="facts" id="facts"></div>
  </footer>
</div>
<div id="park" hidden></div>
<div class="pop" id="prefs" hidden></div>
<div id="tip" role="tooltip"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog id="confirm"><h2 id="cTitle"></h2><div id="cBody" class="muted"></div>
  <div class="btns"><button class="btn" value="no" id="cNo">Cancel</button><button class="btn bad" id="cYes">Reset</button></div></dialog>
<script src="app.js"></script>
</body>
</html>
