<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stepwise · Dependency plans</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div><span class="eyebrow">STEPWISE / DEPENDENCY WORKSPACE</span><h1 id="title">Loading plan…</h1></div><div id="connection" role="status">Connecting</div><button id="settings-toggle">Customize</button></header>
<section id="settings" hidden aria-label="Interface preferences"><label>Theme <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Density <select id="density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label><label>Direction <select id="direction"><option value="horizontal">Left to right</option><option value="vertical">Top to bottom</option></select></label><label>Text size <input id="font" type="range" min="12" max="18" value="14"></label><label>Panel width <input id="panel" type="range" min="260" max="520" value="340"></label><label><input type="checkbox" id="show-size" checked> Show estimates</label><button id="reset-prefs">Reset preferences</button></section>
<section class="summary" id="summary" aria-label="Progress summary"></section>
<nav aria-label="Plan tools"><label class="search">Find a step <input id="search" type="search" placeholder="ID, title, area…"></label><label>Show <select id="filter"><option value="all">All steps</option><option value="ready">Ready</option><option value="in_progress">In progress</option><option value="blocked">Blocked</option><option value="done">Done</option><option value="inconsistent">Prerequisite conflicts</option></select></label><label>Area <select id="area"><option value="">All areas</option></select></label><button id="graph-view" aria-pressed="true">Graph</button><button id="list-view" aria-pressed="false">Build order</button><button id="chain">Longest chain</button><button id="fit">Fit</button><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button></nav>
<p class="hint">Arrows run from prerequisite to dependent. Ready means prerequisites are recorded done; it is not a priority ranking.</p>
<main><section id="viewport" aria-label="Dependency graph"><div id="world"><svg id="edges" aria-hidden="true"></svg><div id="nodes"></div></div><div id="order" hidden></div></section><aside><section id="detail"></section><section><h2>Activity</h2><div id="activity"></div></section></aside></main><footer id="repo">Project data and interface preferences are stored separately.</footer><div id="error" role="alert" hidden></div></body></html>
